name: CI/CD - Build & Deploy to VPS

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: mission-control-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner disk space
        run: df -h / "$RUNNER_TEMP"

      - name: Isolate Docker registry credentials
        shell: bash
        run: |
          config_dir=$(mktemp -d "${RUNNER_TEMP}/nexa-docker.XXXXXXXX")
          printf 'DOCKER_CONFIG=%s\n' "$config_dir" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'alirezaabddev' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME || 'alirezaabddev' }}/nexa-mission-control
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Docker Hub Description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'alirezaabddev' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME || 'alirezaabddev' }}/nexa-mission-control
          readme-filepath: ./DOCKERHUB.md

  deploy:
    name: Deploy to Production VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'alirezaabddev' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST || '130.185.78.131' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script_stop: true
          script: |
            set -e
            echo "🚀 [1/5] Navigating to Mission Control directory..."
            cd /opt/mission-control

            echo "🔑 [2/5] Authenticating Docker registry on VPS..."
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin || true
            fi

            echo "📦 [3/5] Pulling latest production container image..."
            if ! docker compose pull mission-control; then
              echo "⚠️ compose pull failed, trying direct docker pull..."
              docker pull alirezaabddev/nexa-mission-control:latest
            fi

            echo "🔄 [4/5] Recreating container with zero downtime..."
            docker compose up -d --remove-orphans mission-control

            echo "⏳ [5/5] Verifying container health..."
            sleep 6
            docker ps --filter name=mission-control
            docker exec mission-control curl -sf http://localhost:1337/api/v1/health || exit 1

            echo "✅ Deployment successful! Live at https://tasks.nexasmart.net"
