services:
  # Standalone single-image deployment
  mission-control:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexamc/mission-control:latest
    container_name: mission-control
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      - PORT=1337
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///data/mission-control.db?mode=rwc
      - JWT_SECRET=${JWT_SECRET:-mission-control-super-secure-production-jwt-token-2026!}
      - UPLOAD_DIR=/uploads
      - STATIC_DIR=/app/dist
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1337/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  data:
  uploads:
