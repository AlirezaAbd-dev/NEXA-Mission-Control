services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///data/taskflow.db?mode=rwc
      - JWT_SECRET=taskflow_production_jwt_super_secret_key_change_me_in_prod_12345
      - UPLOAD_DIR=/uploads
    volumes:
      - db_data:/data
      - uploads_data:/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  db_data:
  uploads_data:
