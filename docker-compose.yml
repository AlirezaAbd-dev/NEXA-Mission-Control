services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///data/mission-control.db?mode=rwc
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - UPLOAD_DIR=/uploads
    volumes:
      - db_data:/data
      - uploads_data:/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
