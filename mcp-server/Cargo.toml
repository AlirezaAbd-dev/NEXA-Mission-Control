[package]
name = "nexa-mission-control-mcp"
version = "1.0.0"
edition = "2021"
description = "Ultra-lightweight Rust Model Context Protocol (MCP) server for NEXA Mission Control"

[dependencies]
tokio = { version = "1.40", features = ["macros", "rt", "rt-multi-thread", "io-std", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
